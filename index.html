<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Pulse — Personal Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#0a0a0c;
  --surface:#15161a;
  --surface-2:#1c1e23;
  --border:#26282f;
  --text:#eceef0;
  --muted:#8b8f9a;
  --accent:#5eead4;
  --accent-dim:#2e5b54;
  --amber:#f5a623;
  --red:#f5645e;
  --radius:14px;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "Roboto Mono", Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:15px; -webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui);
  min-height:100vh; min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---- top bar ---- */
.topbar{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:.6rem;
  padding:calc(env(safe-area-inset-top) + .9rem) 1rem .9rem;
  background:linear-gradient(180deg, var(--bg) 70%, transparent);
  backdrop-filter:blur(6px);
}
.back-btn{
  width:2.2rem; height:2.2rem; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; flex:0 0 auto;
}
.topbar h1{font-size:1.05rem; font-weight:600; margin:0; letter-spacing:.01em;}
.topbar .sub{font-size:.75rem; color:var(--muted); margin-top:.1rem;}

main{flex:1; padding:0 1rem 6rem;}

/* ---- cards / primitives ---- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:1rem; margin-bottom:.75rem;
}
.card.pressable{transition:transform .1s ease;}
.card.pressable:active{transform:scale(.98);}
.section-label{
  font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted);
  margin:1.1rem 0 .5rem; font-weight:600;
}
.section-label:first-child{margin-top:0;}
.hero-tile{
  display:flex; align-items:center; gap:.85rem; padding:1.1rem;
  border-radius:var(--radius); border:1px solid var(--border); background:var(--surface);
  margin-bottom:.7rem;
}
.hero-tile .ico{
  width:2.6rem; height:2.6rem; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; flex:0 0 auto;
}
.hero-tile .body{flex:1; min-width:0;}
.hero-tile .body .t{font-weight:600; font-size:1rem;}
.hero-tile .body .s{font-size:.78rem; color:var(--muted); margin-top:.15rem;}
.hero-tile .chev{color:var(--muted); font-size:1.1rem;}

.stat-row{display:flex; gap:.6rem;}
.stat-tile{
  flex:1; min-width:0; background:var(--surface-2); border-radius:10px; padding:.7rem .4rem; text-align:center;
}
.stat-tile .n{font-family:var(--font-mono); font-size:1.25rem; font-weight:700; color:var(--accent); overflow:hidden; text-overflow:ellipsis;}
.stat-tile .l{font-size:.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:.2rem; overflow-wrap:anywhere;}

.tabbar{display:flex; gap:.4rem; margin-bottom:.9rem; background:var(--surface-2); padding:.25rem; border-radius:10px;}
.tabbar button{
  flex:1; border:none; background:transparent; color:var(--muted); padding:.5rem 0; border-radius:8px;
  font-size:.82rem; font-weight:600;
}
.tabbar button.active{background:var(--accent); color:#04211d;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  padding:.75rem 1rem; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:.88rem; font-weight:600; width:100%;
}
.btn.primary{background:var(--accent); color:#04211d; border-color:var(--accent);}
.btn.danger{background:transparent; color:var(--red); border-color:#4a2626;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.4;}
.btn-row{display:flex; gap:.5rem;}
.btn-row .btn{width:auto; flex:1;}

.field{margin-bottom:.8rem;}
.field label{display:block; font-size:.75rem; color:var(--muted); margin-bottom:.35rem; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:.65rem .7rem; border-radius:9px; font-size:.92rem;
}
.field textarea{resize:vertical; min-height:4rem;}

.pill{
  display:inline-block; padding:.2rem .55rem; border-radius:999px; font-size:.68rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.04em;
}
.pill.open{background:#2e3b5b; color:#9db4ff;}
.pill.done{background:var(--accent-dim); color:var(--accent);}
.pill.postponed{background:#4a3a1f; color:var(--amber);}
.pill.cancelled{background:#3a2223; color:var(--red);}
.pill.overdue{background:#4a2323; color:#ff8f88;}

.empty{text-align:center; padding:2.2rem 1rem; color:var(--muted);}
.empty .big{font-size:2rem; margin-bottom:.4rem;}
.empty p{font-size:.85rem; margin:.2rem 0;}

.list-row{
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
  padding:.8rem 0; border-bottom:1px solid var(--border);
}
.list-row:last-child{border-bottom:none;}
.list-row .main{min-width:0; flex:1;}
.list-row .title{font-weight:600; font-size:.9rem;}
.list-row .meta{font-size:.75rem; color:var(--muted); margin-top:.15rem;}
.list-row .val{font-family:var(--font-mono); font-weight:700; color:var(--accent); font-size:.95rem; white-space:nowrap;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal{
  width:100%; max-width:520px; background:var(--surface); border-radius:18px 18px 0 0;
  padding:1.1rem 1.1rem calc(env(safe-area-inset-bottom) + 1.1rem); max-height:88vh; overflow-y:auto;
  border-top:1px solid var(--border);
}
.modal h2{margin:.1rem 0 1rem; font-size:1.05rem;}
.modal-handle{width:2.4rem; height:.28rem; background:var(--border); border-radius:99px; margin:0 auto .9rem;}

/* session screen */
.session-header{text-align:center; margin-bottom:.8rem;}
.session-header .prog{font-size:.75rem; color:var(--muted); font-family:var(--font-mono);}
.session-header .name{font-size:1.35rem; font-weight:700; margin-top:.3rem;}
.session-header .target{font-size:.8rem; color:var(--accent); margin-top:.2rem;}
.cues{margin:0; padding-left:1.1rem; font-size:.85rem; color:var(--text); line-height:1.6;}
.cues li{margin-bottom:.3rem;}
.timer-ring{
  width:9rem; height:9rem; border-radius:999px; border:6px solid var(--surface-2);
  display:flex; align-items:center; justify-content:center; margin:1rem auto; position:relative;
}
.timer-ring .n{font-family:var(--font-mono); font-size:2rem; font-weight:700; color:var(--amber);}
.weight-picker-btn{
  width:100%; padding:1rem; text-align:center; background:var(--surface-2); border:1px dashed var(--border);
  border-radius:12px; font-family:var(--font-mono); font-size:1.3rem; font-weight:700; color:var(--muted);
}
.weight-picker-btn.set{color:var(--accent); border-style:solid; border-color:var(--accent-dim);}
.wheel{max-height:14rem; overflow-y:auto; border:1px solid var(--border); border-radius:10px; margin:.7rem 0;}
.wheel .opt{padding:.7rem 1rem; font-family:var(--font-mono); font-size:1rem; border-bottom:1px solid var(--border);}
.wheel .opt.sel{background:var(--accent-dim); color:var(--accent); font-weight:700;}
.wheel .opt:last-child{border-bottom:none;}

.link-row{display:flex; align-items:center; gap:.5rem; font-size:.8rem; color:var(--accent); text-decoration:none; margin-top:.5rem;}

.fab-space{height:1rem;}
::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STORAGE ============================= */
const STORE_KEY = 'pulse_tracker_v1';
const SESSION_KEY = 'pulse_active_session_v1';
// Conservative limits keep browser storage bounded even after years of use.
const DATA_LIMITS = {workoutSessions:500, cardioLogs:1000, activityLogs:1000, healthEntries:2000, dailyMetrics:2000, tasks:2000, workoutPlans:50};
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    workoutSessions: [],
    cardioLogs: [],
    activityLogs: [],
    healthEntries: [],
    dailyMetrics: [],
    tasks: [],
    settings: { lastWorkoutType: null, rounds: 3 }
  };
}
function enforceDataLimits(){
  Object.entries(DATA_LIMITS).forEach(([key,limit])=>{
    if(!Array.isArray(DB[key])) DB[key]=[];
    if(DB[key].length>limit){
      DB[key] = [...DB[key]].sort((a,b)=>(b.createdAt||Date.parse(b.date)||0)-(a.createdAt||Date.parse(a.date)||0)).slice(0,limit);
    }
  });
}
function saveState(){
  enforceDataLimits();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); return true; }
  catch(e){ alert('Pulse could not save because browser storage is full. Export a backup and remove older records.'); return false; }
}
let DB = loadState();
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSession(){
  try{
    if(!session) localStorage.removeItem(SESSION_KEY);
    else localStorage.setItem(SESSION_KEY, JSON.stringify({...session, restTimerId:null}));
  }catch(e){ /* Main records still remain safe if a temporary session cannot be persisted. */ }
}
enforceDataLimits();

/* ============================= EXERCISE DATA ============================= */
const CORE_FINISHER_A = { name:'Plank', target:'Core', cues:['Forearms down, elbows under shoulders','Squeeze glutes, ribs pulled down','Hold a straight line head to heel','Breathe steadily, don\'t sag the hips'] };
const CORE_FINISHER_B = { name:'Side Plank (each side)', target:'Obliques / Core', cues:['Stack feet, prop up on one forearm','Lift hips until body forms a line','Keep shoulder stacked over elbow','Hold, then switch sides'] };

const WORKOUT_A = {
  key:'A', label:'Workout A',
  stations:[
    {name:'Goblet Squat', target:'Quads / Glutes', cues:['Hold weight at chest','Feet shoulder width, toes slightly out','Sit hips back and down, knees tracking toes','Drive through the whole foot to stand']},
    {name:'Push-ups', target:'Chest / Triceps', cues:['Hands slightly wider than shoulders','Body in a straight line, brace core','Lower until chest nears the floor','Press back up without flaring elbows']},
    {name:'Romanian Deadlift', target:'Hamstrings / Glutes', cues:['Soft knees, weight close to thighs','Hinge at the hips, chest stays proud','Lower until you feel a hamstring stretch','Squeeze glutes to return to standing']},
    {name:'Bent-Over Row', target:'Back / Lats', cues:['Hinge forward ~45°, flat back','Pull weight toward your lower ribs','Squeeze shoulder blades together','Lower under control']},
    {name:'Walking Lunges', target:'Legs / Glutes', cues:['Step forward, lower back knee toward floor','Front knee stacked over ankle','Push through front heel to step through','Alternate legs each step']},
    {name:'Overhead Press', target:'Shoulders', cues:['Start weight at shoulder height','Brace core, avoid arching the back','Press straight overhead','Lower with control']},
    {name:'Glute Bridge', target:'Glutes / Hamstrings', cues:['Lie back, knees bent, feet flat','Drive through heels to lift hips','Squeeze glutes hard at the top','Lower slowly, don\'t let hips sag']},
    {name:'Lat Pulldown / Pull-ups', target:'Back / Biceps', cues:['Grip slightly wider than shoulders','Pull elbows down and back','Lead with the chest, not the chin','Control the return to full stretch']},
    {name:'Step-ups', target:'Legs / Glutes', cues:['Step fully onto a stable box or step','Drive through the lead heel to stand tall','Avoid pushing off the trailing foot','Step down with control, alternate legs']},
    {name:'Bicep Curls', target:'Biceps', cues:['Elbows pinned to your sides','Curl without swinging the torso','Squeeze at the top','Lower fully under control']},
  ],
  core: CORE_FINISHER_A
};
const WORKOUT_B = {
  key:'B', label:'Workout B',
  stations:[
    {name:'Deadlift', target:'Full Posterior Chain', cues:['Bar/weight close to shins','Flat back, chest up, brace hard','Drive through the floor, hips and shoulders rise together','Lock out tall, then reverse the hinge']},
    {name:'Incline Push-ups / Bench Press', target:'Chest / Shoulders', cues:['Set hands just outside shoulder width','Lower with elbows ~45° from body','Press back to full extension','Keep core braced throughout']},
    {name:'Bulgarian Split Squat', target:'Quads / Glutes', cues:['Rear foot elevated behind you','Front shin stays fairly vertical','Lower until rear knee nears the floor','Drive through front heel to rise']},
    {name:'Bent-Over Row (wide grip)', target:'Upper Back', cues:['Hinge forward, flat back','Pull elbows out and up toward ribs','Squeeze shoulder blades at the top','Lower under control']},
    {name:'Hip Thrust', target:'Glutes', cues:['Upper back braced on a bench','Drive hips up, chin slightly tucked','Squeeze glutes hard at lockout','Lower with control, don\'t rest at bottom']},
    {name:'Lateral Raise', target:'Shoulders', cues:['Slight bend in the elbows','Raise arms out to shoulder height','Lead with the elbows, not the hands','Lower slowly, avoid swinging']},
    {name:'Leg Press / Wall Sit', target:'Quads', cues:['Feet flat, knees tracking toes','Lower under control to a deep bend','Press through the full foot','Avoid locking knees out hard']},
    {name:'Tricep Dips', target:'Triceps', cues:['Hands on a bench or bars, shoulders down','Lower until elbows hit ~90°','Keep elbows tracking backward, not flared','Press back up to full extension']},
    {name:'Calf Raises', target:'Calves', cues:['Stand tall, weight over the balls of the feet','Rise as high as possible, pause briefly','Lower slowly past neutral for a stretch','Keep the movement controlled, not bouncy']},
    {name:'Face Pulls', target:'Rear Delts / Upper Back', cues:['Pull toward your face, elbows high','Squeeze shoulder blades together','Rotate hands outward at the finish','Return slowly under control']},
  ],
  core: CORE_FINISHER_B
};
function ensureModernData(){
  if(!Array.isArray(DB.dailyMetrics)) DB.dailyMetrics=[];
  if(!Array.isArray(DB.workoutPlans) || !DB.workoutPlans.length){
    DB.workoutPlans=[WORKOUT_A,WORKOUT_B].map(w=>({
      id:'plan-'+w.key, name:w.label, key:w.key, builtIn:true,
      stations:w.stations.map(s=>({...s,cues:[...s.cues]})), core:{...w.core,cues:[...w.core.cues]}
    }));
  }
  DB.workoutPlans.forEach((p,i)=>{
    p.id=p.id||uid(); p.name=p.name||p.label||`Workout ${i+1}`;
    p.stations=Array.isArray(p.stations)?p.stations:[];
    p.core=p.core||{name:'Plank',target:'Core',cues:[]};
  });
  DB.settings={lastWorkoutType:null,rounds:3,...DB.settings};
}
ensureModernData();
function nextWorkoutType(){
  const plans=DB.workoutPlans.filter(p=>p.stations.length);
  if(!plans.length) return null;
  const idx=plans.findIndex(p=>p.id===DB.settings.lastPlanId);
  return plans[(idx+1+plans.length)%plans.length];
}
function workoutByKey(k){ return DB.workoutPlans.find(p=>p.id===k || p.key===k) || WORKOUT_A; }

/* ============================= ROUTER STATE ============================= */
let view = { screen:'home' };
let session = loadSession(); // live workout session state, restored after reloads
let modal = null;   // {type,...}

function go(v){ view = v; render(); }
function openModal(m){ modal = m; render(); }
function closeModal(){ modal = null; render(); }

/* ============================= HELPERS ============================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function fmtDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function isOverdue(t){ return t.status==='open' && t.date && t.date < todayISO(); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function weekAgo(){ const d=new Date(); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10); }
function numberNear(text, labels){
  const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  for(const label of labels){
    const i=lines.findIndex(x=>x.toLowerCase().includes(label));
    if(i>=0){
      const area=[lines[i],lines[i+1]||'',lines[i-1]||''].join(' ');
      const nums=area.match(/\d[\d,]*(?:\.\d+)?/g);
      if(nums?.length) return parseFloat(nums[0].replace(/,/g,''));
    }
  }
  return null;
}
function loadOcrEngine(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    script.onload=()=>resolve(window.Tesseract); script.onerror=()=>reject(new Error('OCR unavailable'));
    document.head.appendChild(script);
  });
}
function sparkline(values,color='var(--accent)'){
  const nums=values.map(Number).filter(Number.isFinite);
  if(nums.length<2) return '';
  const min=Math.min(...nums), max=Math.max(...nums), range=max-min||1;
  const points=nums.map((v,i)=>`${(i/(nums.length-1))*100},${38-((v-min)/range)*32}`).join(' ');
  return `<svg viewBox="0 0 100 42" preserveAspectRatio="none" style="width:100%;height:4.5rem;display:block" role="img" aria-label="Recent trend"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ============================= RENDER SHELL ============================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderScreen() + (modal ? renderModal() : '');
  wireEvents();
}

function screenTitle(){
  const map = {
    home:['Pulse',''],
    fitness:['Fitness',''],
    'fitness-session':['Live Session',''],
    health:['Health',''],
    planner:['Day Planner',''],
    data:['Data & Backup',''],
  };
  return map[view.screen] || ['Pulse',''];
}

function renderScreen(){
  if(view.screen==='fitness-session' && session) return renderSessionScreen();
  const [title] = screenTitle();
  const showBack = view.screen !== 'home';
  let body = '';
  if(view.screen==='home') body = renderHome();
  else if(view.screen==='fitness') body = renderFitness();
  else if(view.screen==='health') body = renderHealth();
  else if(view.screen==='planner') body = renderPlanner();
  else if(view.screen==='data') body = renderData();
  return `
  <div class="topbar">
    ${showBack ? `<button class="back-btn" data-act="back">‹</button>` : ''}
    <div><h1>${title}</h1></div>
  </div>
  <main>${body}</main>`;
}

function backTarget(){
  if(view.screen==='fitness') return {screen:'home'};
  if(view.screen==='health') return {screen:'home'};
  if(view.screen==='planner') return {screen:'home'};
  if(view.screen==='data') return {screen:'home'};
  return {screen:'home'};
}

/* ============================= HOME ============================= */
function renderHome(){
  const thisWeek = DB.workoutSessions.filter(s=>s.date>=weekAgo()).length;
  const totalSessions = DB.workoutSessions.length;
  const openTasks = DB.tasks.filter(t=>t.status==='open').length;
  const overdueTasks = DB.tasks.filter(isOverdue).length;
  return `
  ${session?`<button class="btn primary" data-act="resume-session" style="margin-bottom:1rem;">Resume Workout ${session.type}</button>`:''}
  <div class="stat-row" style="margin-bottom:1rem;">
    <div class="stat-tile"><div class="n">${thisWeek}</div><div class="l">Sessions/wk</div></div>
    <div class="stat-tile"><div class="n">${totalSessions}</div><div class="l">Total sessions</div></div>
    <div class="stat-tile"><div class="n" style="color:${overdueTasks?'var(--red)':'var(--accent)'}">${openTasks}</div><div class="l">Open tasks</div></div>
  </div>
  <div class="hero-tile pressable" data-nav="fitness">
    <div class="ico" style="background:var(--accent-dim); color:var(--accent);">🏋️</div>
    <div class="body"><div class="t">Fitness</div><div class="s">Workouts · Cardio · Activities</div></div>
    <div class="chev">›</div>
  </div>
  <div class="hero-tile pressable" data-nav="health">
    <div class="ico" style="background:#3a2540; color:#d9a8f0;">🩺</div>
    <div class="body"><div class="t">Health</div><div class="s">Vitals · Meds · Appointments · Notes</div></div>
    <div class="chev">›</div>
  </div>
  <div class="hero-tile pressable" data-nav="planner">
    <div class="ico" style="background:#3a3320; color:var(--amber);">🗓️</div>
    <div class="body"><div class="t">Day Planner</div><div class="s">${overdueTasks?overdueTasks+' overdue · ':''}${openTasks} open task${openTasks===1?'':'s'}</div></div>
    <div class="chev">›</div>
  </div>
  <div class="hero-tile pressable" data-nav="data">
    <div class="ico" style="background:#24354a; color:#9fc7ff;">💾</div>
    <div class="body"><div class="t">Data & Backup</div><div class="s">Export or restore your personal records</div></div>
    <div class="chev">›</div>
  </div>
  `;
}

/* ============================= DATA ============================= */
function renderData(){
  const counts = [DB.workoutSessions.length, DB.cardioLogs.length, DB.activityLogs.length, DB.healthEntries.length, DB.dailyMetrics.length, DB.tasks.length];
  const storageKB = Math.ceil(new Blob([JSON.stringify(DB)]).size/1024);
  return `
  <div class="card">
    <div style="font-weight:700; margin-bottom:.35rem;">Your data stays on this device</div>
    <div style="font-size:.82rem; color:var(--muted); line-height:1.5;">A browser reset can erase it. Export a backup regularly and keep that file somewhere private.</div>
    <div class="stat-row" style="margin-top:1rem;">
      <div class="stat-tile"><div class="n">${counts.reduce((a,b)=>a+b,0)}</div><div class="l">Records</div></div>
      <div class="stat-tile"><div class="n">${DB.workoutSessions.length}</div><div class="l">Workouts</div></div>

/* ---- live session ---- */
function startSession(){
  const selectedId=document.getElementById('planSelect')?.value;
  const wtype = DB.workoutPlans.find(p=>p.id===selectedId) || nextWorkoutType();
  if(!wtype || !wtype.stations.length) return;
  const rounds = parseInt(document.getElementById('roundsSelect')?.value || DB.settings.rounds || 3);
  DB.settings.rounds = rounds;
  const plan = [];
  for(let r=1;r<=rounds;r++){
    wtype.stations.forEach((st,i)=> plan.push({round:r, stationIndex:i, ...st}));
  }
  session = {
    type: wtype.key||wtype.id,
    planId:wtype.id,
    planName:wtype.name,
    rounds,
    plan,
    core: wtype.core,
    idx: 0,
    stationLogs: plan.map(p=>({weight:null,reps:p.reps||null})),
    coreLog: {done:false},
    phase: 'exercise', // exercise | rest-station | rest-round | core | rpe
    restRemaining: 0,
    restTimerId: null,
    startedAt: Date.now(),
    restExercise:Math.max(0,Math.min(300,wtype.restExercise??20)),
    restRound:Math.max(0,Math.min(600,wtype.restRound??75)),
  };
  saveSession();
  go({screen:'fitness-session'});
}

function currentPlanItem(){ return session.plan[session.idx]; }

function markStationComplete(weight){
  session.stationLogs[session.idx].weight = weight;
  const isLastInRound = (session.idx+1) % (session.plan.length/session.rounds) === 0;
  const isLastOverall = session.idx === session.plan.length-1;
  if(isLastOverall){
    session.phase = 'core';
  } else if(isLastInRound){
    session.phase = 'rest-round';
    startRestTimer(session.restRound);
  } else {
    session.phase = 'rest-station';
    startRestTimer(session.restExercise);
  }
  saveSession();
  render();
}

function startRestTimer(seconds){
  session.restRemaining = seconds;
  session.restEndsAt = Date.now() + seconds*1000;
  saveSession();
  clearInterval(session.restTimerId);
  session.restTimerId = setInterval(()=>{
    session.restRemaining = Math.max(0, Math.ceil((session.restEndsAt-Date.now())/1000));
    if(session.restRemaining<=0){
      clearInterval(session.restTimerId);
      session.idx++;
      session.phase = 'exercise';
      session.restEndsAt = null;
      saveSession();
    }
    render();
  },1000);
}

function skipRest(){
  clearInterval(session.restTimerId);
  session.idx++;
  session.phase='exercise';
  session.restEndsAt = null;
  saveSession();
  render();
}

function sessionBack(){
  if(session.phase==='core'){ session.phase='exercise'; saveSession(); render(); return; }
  if(session.idx===0) return;
  clearInterval(session.restTimerId);
  session.idx--;
  session.phase='exercise';
  session.restEndsAt = null;
  saveSession();
  render();
}

function finishCore(){ session.phase='rpe'; saveSession(); render(); }

function finishSession(rpe, partial){
  const durationSec = Math.round((Date.now()-session.startedAt)/1000);
  DB.workoutSessions.push({
    id: uid(), type: session.type, date: todayISO(), startedAt: session.startedAt,
    durationSec, rounds: session.rounds, rpe: rpe||null, partial: !!partial,
    stationLogs: session.plan.map((p,i)=>({name:p.name, round:p.round, weight:session.stationLogs[i].weight, reps:session.stationLogs[i].reps})),
    coreCompleted: session.coreLog.done,
  });
  DB.settings.lastWorkoutType = session.type;
  DB.settings.lastPlanId = session.planId;
  saveState();
  session = null;
  saveSession();
  go({screen:'fitness'});
}

function endSessionEarly(){
  openModal({type:'confirm-end-session'});
}

/* ============================= EVENTS ============================= */
function wireEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=> go({screen: el.getAttribute('data-nav')}));
  });
  const backBtn = app.querySelector('[data-act="back"]');
  if(backBtn) backBtn.addEventListener('click', ()=> go(backTarget()));

  app.querySelectorAll('[data-fit-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ fitnessTab = el.getAttribute('data-fit-tab'); render(); });
  });
  app.querySelectorAll('[data-health-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{ healthCategory = el.getAttribute('data-health-cat'); render(); });
  });
  app.querySelectorAll('[data-plan-filter]').forEach(el=>{
    el.addEventListener('click', ()=>{ plannerFilter = el.getAttribute('data-plan-filter'); render(); });
  });

  const startBtn = app.querySelector('[data-act="start-session"]');
  if(startBtn) startBtn.addEventListener('click', startSession);

  app.querySelectorAll('[data-act="add-cardio"]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'add-cardio'})));
  app.querySelectorAll('[data-act="add-activity"]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'add-activity'})));
  app.querySelectorAll('[data-act="add-health"]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'add-health'})));
  app.querySelectorAll('[data-act="add-task"]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'add-task'})));
  app.querySelectorAll('[data-act="add-plan"]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'edit-plan'})));
  app.querySelectorAll('[data-act="add-metric"]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'add-metric'})));
  app.querySelectorAll('[data-act="scan-health"]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'add-metric',scan:true})));

  app.querySelectorAll('[data-open-health]').forEach(el=>{
    el.addEventListener('click', ()=> openModal({type:'view-health', id: el.getAttribute('data-open-health')}));
  });
  app.querySelectorAll('[data-open-task]').forEach(el=>{
    el.addEventListener('click', ()=> openModal({type:'view-task', id: el.getAttribute('data-open-task')}));
  });
  app.querySelectorAll('[data-open-cardio]').forEach(el=>{
    el.addEventListener('click', ()=> openModal({type:'add-cardio', id: el.getAttribute('data-open-cardio')}));
  });
  app.querySelectorAll('[data-open-activity]').forEach(el=>{
    el.addEventListener('click', ()=> openModal({type:'add-activity', id: el.getAttribute('data-open-activity')}));
  });
  app.querySelectorAll('[data-open-plan]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'edit-plan',id:el.getAttribute('data-open-plan')})));
  app.querySelectorAll('[data-open-metric]').forEach(el=>el.addEventListener('click', ()=>openModal({type:'add-metric',id:el.getAttribute('data-open-metric')})));
  const resumeSession = app.querySelector('[data-act="resume-session"]');
  if(resumeSession) resumeSession.addEventListener('click', ()=>go({screen:'fitness-session'}));

  // session-specific
  const openWeightBtn = app.querySelector('[data-act="open-weight"]');
  if(openWeightBtn) openWeightBtn.addEventListener('click', ()=> openModal({type:'weight-picker'}));
  const markCompleteBtn = app.querySelector('[data-act="mark-complete"]');
  if(markCompleteBtn) markCompleteBtn.addEventListener('click', ()=>{
    const w = session.stationLogs[session.idx].weight;
    const reps=document.getElementById('sessionReps')?.value;
    session.stationLogs[session.idx].reps=reps?Math.max(0,Math.min(999,parseInt(reps))):null;
    markStationComplete(w);
  });
  const sessBack = app.querySelector('[data-act="session-back"]');
  if(sessBack) sessBack.addEventListener('click', sessionBack);
  const skipRestBtn = app.querySelector('[data-act="skip-rest"]');
  if(skipRestBtn) skipRestBtn.addEventListener('click', skipRest);
  const endSessBtn = app.querySelectorAll('[data-act="end-session"]');
  endSessBtn.forEach(el=>el.addEventListener('click', endSessionEarly));
  const finishCoreBtn = app.querySelector('[data-act="finish-core"]');
  if(finishCoreBtn) finishCoreBtn.addEventListener('click', ()=>{ session.coreLog.done = true; finishCore(); });
  app.querySelectorAll('[data-rpe]').forEach(el=>{
    el.addEventListener('click', ()=> finishSession(parseInt(el.getAttribute('data-rpe')), false));
  });
  const skipRpe = app.querySelector('[data-act="skip-rpe"]');
  if(skipRpe) skipRpe.addEventListener('click', ()=> finishSession(null, false));

  // modal-level
  const backdrop = app.querySelector('[data-act="close-modal-backdrop"]');
  if(backdrop){
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });
  }
  app.querySelectorAll('[data-act="close-modal"]').forEach(el=>el.addEventListener('click', closeModal));

  app.querySelectorAll('[data-weight]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const raw = el.getAttribute('data-weight');
      session.stationLogs[session.idx].weight = raw==='BW' ? 'BW' : parseFloat(raw);
      saveSession();
      closeModal();
    });
  });

  const saveCardio = app.querySelector('[data-act="save-cardio"]');
  if(saveCardio) saveCardio.addEventListener('click', ()=>{
    const g = id => document.getElementById(id);
    const id = saveCardio.getAttribute('data-id');
    const existing = DB.cardioLogs.find(x=>x.id===id);
    const record = {
      id: id||uid(), createdAt: existing?.createdAt||Date.now(),
      type: g('cType').value, date: g('cDate').value || todayISO(),
      duration: g('cDuration').value?parseFloat(g('cDuration').value):null,
      calories: g('cCalories').value?parseFloat(g('cCalories').value):null,
      hrAvg: g('cHrAvg').value?parseFloat(g('cHrAvg').value):null,
      hrMax: g('cHrMax').value?parseFloat(g('cHrMax').value):null,
      steps: g('cSteps').value?parseFloat(g('cSteps').value):null,
      vo2max: g('cVo2').value?parseFloat(g('cVo2').value):null,
    };
    if(existing) Object.assign(existing, record); else DB.cardioLogs.push(record);
    saveState(); closeModal();
  });

  const saveActivity = app.querySelector('[data-act="save-activity"]');
  if(saveActivity) saveActivity.addEventListener('click', ()=>{
    const g = id => document.getElementById(id);
    if(!g('aType').value.trim()) return;
    const id = saveActivity.getAttribute('data-id');
    const existing = DB.activityLogs.find(x=>x.id===id);
    const record = {
      id: id||uid(), createdAt: existing?.createdAt||Date.now(),
      type: g('aType').value.trim(), date: g('aDate').value || todayISO(),
      duration: g('aDuration').value?parseFloat(g('aDuration').value):null,
      notes: g('aNotes').value.trim(),
    };
    if(existing) Object.assign(existing, record); else DB.activityLogs.push(record);
    saveState(); closeModal();
  });

  const saveHealth = app.querySelector('[data-act="save-health"]');
  if(saveHealth) saveHealth.addEventListener('click', ()=>{
    const g = id => document.getElementById(id);
    if(!g('hLabel').value.trim()) return;
    const id = saveHealth.getAttribute('data-id');
    const existing = DB.healthEntries.find(x=>x.id===id);
    const record = {
      id: id||uid(), category: g('hCat').value, label: g('hLabel').value.trim(),
      value: g('hValue').value.trim(), unit: g('hUnit').value.trim(),
      date: g('hDate').value || todayISO(), notes: g('hNotes').value.trim(),
    };
    if(existing) Object.assign(existing, record); else DB.healthEntries.push(record);
    saveState(); closeModal();
  });
  const delHealth = app.querySelector('[data-act="delete-health"]');
  if(delHealth) delHealth.addEventListener('click', ()=>{
    if(!confirm('Delete this health entry? This cannot be undone.')) return;
    DB.healthEntries = DB.healthEntries.filter(e=>e.id!==delHealth.getAttribute('data-id'));
    saveState(); closeModal();
  });
  const editHealth = app.querySelector('[data-act="edit-health"]');
  if(editHealth) editHealth.addEventListener('click', ()=>openModal({type:'add-health', id:editHealth.getAttribute('data-id')}));

  const saveTask = app.querySelector('[data-act="save-task"]');
  if(saveTask) saveTask.addEventListener('click', ()=>{
    const g = id => document.getElementById(id);
    if(!g('tTitle').value.trim()) return;
    const id = saveTask.getAttribute('data-id');
    const existing = DB.tasks.find(x=>x.id===id);
    const record = {
      id: id||uid(), title: g('tTitle').value.trim(), date: g('tDate').value || null,
      time: g('tTime').value || null, location: g('tLocation').value.trim(),
      notes: g('tNotes').value.trim(), status:existing?.status||'open',
      history:existing?.history||[`Created ${fmtDateTime(Date.now())}`],
    };
    if(existing){ record.history.push(`Edited ${fmtDateTime(Date.now())}`); Object.assign(existing, record); }
    else DB.tasks.push(record);
    saveState(); closeModal();
  });
  const editTask = app.querySelector('[data-act="edit-task"]');
  if(editTask) editTask.addEventListener('click', ()=>openModal({type:'add-task', id:editTask.getAttribute('data-id')}));

  app.querySelectorAll('[data-delete-record]').forEach(el=>el.addEventListener('click', ()=>{
    if(!confirm('Delete this record? This cannot be undone.')) return;
    const keys={cardio:'cardioLogs',activity:'activityLogs',metric:'dailyMetrics'};
    const key=keys[el.getAttribute('data-delete-record')];
    if(!key) return;
    DB[key] = DB[key].filter(x=>x.id!==el.getAttribute('data-id'));
    saveState(); closeModal();
  }));

  const savePlan=app.querySelector('[data-act="save-plan"]');
  if(savePlan) savePlan.addEventListener('click', ()=>{
    const name=document.getElementById('pName').value.trim();
    const stations=document.getElementById('pExercises').value.split('\n').map(line=>{
      const [exercise,target='',cueText='',reps='']=line.split('|').map(x=>x.trim());
      return {name:exercise,target:target||'General',cues:cueText.split(';').map(x=>x.trim()).filter(Boolean),reps:reps||null};
    }).filter(x=>x.name).slice(0,30);
    if(!name || !stations.length){ alert('Add a plan name and at least one exercise.'); return; }
    const id=savePlan.getAttribute('data-id'); const existing=DB.workoutPlans.find(x=>x.id===id);
    const coreName=document.getElementById('pCore').value.trim()||'Plank';
    const restExercise=Math.max(0,Math.min(300,parseInt(document.getElementById('pRestExercise').value)||0));
    const restRound=Math.max(0,Math.min(600,parseInt(document.getElementById('pRestRound').value)||0));
    const record={id:id||uid(),name,stations,restExercise,restRound,core:{name:coreName,target:'Core',cues:document.getElementById('pCoreCues').value.split(';').map(x=>x.trim()).filter(Boolean)}};
    if(existing) Object.assign(existing,record); else DB.workoutPlans.push(record);
    saveState(); closeModal();
  });
  const deletePlan=app.querySelector('[data-act="delete-plan"]');
  if(deletePlan) deletePlan.addEventListener('click', ()=>{
    if(DB.workoutPlans.length<=1){ alert('Keep at least one workout plan.'); return; }
    if(!confirm('Delete this workout plan? Completed workout history will remain.')) return;
    DB.workoutPlans=DB.workoutPlans.filter(x=>x.id!==deletePlan.getAttribute('data-id')); saveState(); closeModal();
  });

  const saveMetric=app.querySelector('[data-act="save-metric"]');
  if(saveMetric) saveMetric.addEventListener('click', ()=>{
    const val=id=>{const raw=document.getElementById(id).value;return raw===''?null:parseFloat(raw)};
    const id=saveMetric.getAttribute('data-id'); const existing=DB.dailyMetrics.find(x=>x.id===id);
    const record={id:id||uid(),createdAt:existing?.createdAt||Date.now(),date:document.getElementById('mDate').value||todayISO(),steps:val('mSteps'),distanceKm:val('mDistance'),calories:val('mCalories'),heartRate:val('mHeart'),restingHr:val('mResting'),sleepHours:val('mSleep'),weightKg:val('mWeight'),notes:document.getElementById('mNotes').value.trim()};
    if(existing) Object.assign(existing,record); else DB.dailyMetrics.push(record);
    saveState(); closeModal();
  });
  const runOcr=app.querySelector('[data-act="run-ocr"]');
  if(runOcr) runOcr.addEventListener('click', async ()=>{
    const file=document.getElementById('metricImage').files[0]; const status=document.getElementById('ocrStatus');
    if(!file){ status.textContent='Choose a screenshot first.'; return; }
    if(file.size>12*1024*1024){ status.textContent='Please choose an image under 12 MB.'; return; }
    runOcr.disabled=true; status.textContent='Loading private on-device text recognition…';
    try{
      const engine=await loadOcrEngine();
      const result=await engine.recognize(file,'eng',{logger:m=>{if(m.status&&m.progress!=null)status.textContent=`${m.status} · ${Math.round(m.progress*100)}%`;}});
      const text=result.data.text||'';
      const set=(id,v)=>{if(v!=null&&!Number.isNaN(v))document.getElementById(id).value=v};
      set('mSteps',numberNear(text,['steps','step count'])); set('mDistance',numberNear(text,['distance']));
      set('mCalories',numberNear(text,['active calories','calories','kcal'])); set('mResting',numberNear(text,['resting heart']));
      set('mHeart',numberNear(text,['average heart','avg heart','heart rate'])); set('mSleep',numberNear(text,['sleep'])); set('mWeight',numberNear(text,['weight']));
      status.textContent='Extraction complete. Review every value before saving; screenshots vary by watch and app.';
    }catch(e){ status.textContent='Could not read this screenshot. Check your connection or enter the values manually.'; }
    runOcr.disabled=false;
  });

  const exportBtn = app.querySelector('[data-act="export-data"]');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const payload = {app:'Pulse', version:1, exportedAt:new Date().toISOString(), data:DB};
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`pulse-backup-${todayISO()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  const importFile = app.querySelector('#importFile');
  const chooseImport = app.querySelector('[data-act="choose-import"]');
  if(chooseImport && importFile) chooseImport.addEventListener('click', ()=>importFile.click());
  if(importFile) importFile.addEventListener('change', async ()=>{
    const file = importFile.files[0];
    if(!file) return;
    try{
      const parsed = JSON.parse(await file.text());
      const incoming = parsed?.app==='Pulse' ? parsed.data : parsed;
      const required = ['workoutSessions','cardioLogs','activityLogs','healthEntries','tasks'];
      if(!incoming || !required.every(k=>Array.isArray(incoming[k]))) throw new Error('Invalid Pulse backup');
      if(!confirm('Replace all data on this device with this backup?')) return;
      DB = {...incoming, settings:{lastWorkoutType:null,rounds:3,...incoming.settings}};
      ensureModernData();
      saveState(); render(); alert('Backup restored successfully.');
    }catch(e){ alert('This file is not a valid Pulse backup.'); }
  });

  ['task-complete','task-postpone','task-cancel','task-reopen'].forEach(act=>{
    const el = app.querySelector(`[data-act="${act}"]`);
    if(!el) return;
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-id');
      const t = DB.tasks.find(x=>x.id===id);
      if(!t) return;
      if(act==='task-complete'){ t.status='completed'; t.history.push(`Completed ${fmtDateTime(Date.now())}`); }
      if(act==='task-cancel'){
        const reason = prompt('Reason for cancelling?') || 'No reason given';
        t.status='cancelled'; t.history.push(`Cancelled ${fmtDateTime(Date.now())} — ${reason}`);
      }
      if(act==='task-postpone'){
        const days = prompt('Postpone by how many days? (or type a new date YYYY-MM-DD)', '1');
        if(days){
          let newDate;
          if(/^\d{4}-\d{2}-\d{2}$/.test(days.trim())) newDate = days.trim();
          else { const d=new Date((t.date||todayISO())+'T00:00:00'); d.setDate(d.getDate()+parseInt(days)); newDate = d.toISOString().slice(0,10); }
          t.date = newDate; t.status='open'; t.history.push(`Postponed to ${newDate}`);
        }
      }
      if(act==='task-reopen'){ t.status='open'; t.history.push(`Reopened ${fmtDateTime(Date.now())}`); }
      saveState(); closeModal();
    });
  });

  const confirmEnd = app.querySelector('[data-act="confirm-end-session"]');
  if(confirmEnd) confirmEnd.addEventListener('click', ()=> finishSession(null, true));
}

/* ============================= INIT ============================= */
render();

// Continue an in-progress rest timer after the page or app is reopened.
if(session && (session.phase==='rest-station' || session.phase==='rest-round')){
  const remaining = session.restEndsAt ? Math.max(0, Math.ceil((session.restEndsAt-Date.now())/1000)) : session.restRemaining;
  if(remaining>0) startRestTimer(remaining);
  else { session.idx++; session.phase='exercise'; session.restEndsAt=null; saveSession(); render(); }
}

/* register service worker for notifications */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
