function fresh(){return JSON.parse(JSON.stringify(EMPTY))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?{...fresh(),...x,profile:{...EMPTY.profile,...x.profile}}:fresh()}catch(e){return fresh()}}
let db=load(),tab='today',modal=null;
function trimData(){Object.entries(LIMITS).forEach(([k,n])=>{if(!Array.isArray(db[k]))db[k]=[];db[k]=db[k].slice(-n)})}
function save(){trimData();try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Sakhi could not save because browser storage is full. Export a backup, then remove older entries or the profile photo.');return false}}
const $=s=>document.querySelector(s), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function iso(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function dateFmt(x){return new Date(x+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function weekInfo(){if(!db.profile.dueDate)return null;const remaining=Math.round((new Date(db.profile.dueDate+'T12:00:00')-new Date(iso()+'T12:00:00'))/86400000);const elapsed=Math.max(0,280-remaining);return{week:Math.max(0,Math.min(42,Math.floor(elapsed/7))),day:elapsed%7,remaining:Math.max(0,remaining)}}

e choices still count as meaningful progress.','A cup of water can be a quiet promise to yourself.','One completed reminder is worth celebrating.','A single journal line can hold a whole day.','Every question saved for an appointment is an act of care.','Asking for help is part of caring for your family.','Support turns a heavy day into a shared one.','You deserve to receive care as freely as you give it.','Feeling tired is not the same as falling short.','A slow day can still be full of growth.','Patience with yourself is part of preparing for baby.','Your body is adapting; your kindness can adapt with it.','Baby needs a cared-for mother, not a perfect one.','Kindness can be the most useful routine of the day.','One peaceful minute belongs entirely to you.','Inhale a little calm; exhale a little pressure.','A hand on your belly can be a tiny family gathering.','One smile from your three-year-old can soften a long day.','The memories forming now may be simple, but they are still precious.','Your older child is not losing love; the family is growing more of it.','A new baby does not replace an old rhythm—it adds another beat.','Sibling bonds begin with stories, questions, and patient little moments.','Preparing for baby is more about love than having every item ready.','You are allowed to ask the same question more than once.','You are allowed to have more than one feeling at a time.','Excitement and uncertainty can sit beside each other.','Being strong does not mean never needing rest.','Receiving care is a form of strength.','Listening to your body is useful, not selfish.','A gentle boundary can protect a peaceful day.','A nap can be part of the plan.','A simple meal and a quiet evening can be plenty.','A few mindful steps can make space for a calmer breath.','Every sip is a small pause for care.','Meditation needs only one moment of attention.','Movement can be gentle, joyful, and guided by what feels right today.','Each new week is one more page in your family’s function dateOffset(days){const d=new Date();d.setDate(d.getDate()+days);return iso(d)}
function dailyRecord(date,create=false){let x=db.daily.find(x=>x.date===date);if(!x&&create){x={date,water:0,waterAdds:[],prenatalDone:null,soakedNutsDone:null};db.daily.push(x)}if(x&&!Array.isArray(x.waterAdds))x.waterAdds=[];return x}
function todayRecord(){return dailyRecord(iso(),true)}
function careDays(count,key='prenatalDone'){return Array.from({length:count},(_,i)=>{const date=dateOffset(i-count+1),record=dailyRecord(date);return{date,done:!!record?.[key]}})}
function daysUntil(dateStr){return Math.round((new Date(dateStr+'T12:00:00')-new Date(iso()+'T12:00:00'))/86400000)}
function toggleCare(date){const record=dailyRecord(date,true);record.prenatalDone=record.prenatalDone?null:Date.parse(date+'T12:00:00');save();render()}
function toggleNuts(date){const record=dailyRecord(date,true);record.soakedNutsDone=record.soakedNutsDone?null:Date.parse(date+'T12:00:00');save();render()}
function addWater(amount){const d=todayRecord(),added=Math.max(0,Math.min(3000,Number(amount)||0,20000-d.water));if(!added)return;d.water+=added;d.waterAdds.push(added);d.waterAdds=d.waterAdds.slice(-100);save();render()}
function undoWater(){const d=todayRecord(),last=d.waterAdds.pop();if(!last)return;d.water=Math.max(0,d.water-last);save();render()}
function quote(){const day=Math.floor(new Date(iso()+'T12:00:00').getTime()/86400000),pool=day%2===0?SMILE_QUOTES:QUOTES;return pool[day%pool.length]}
function spark(values,color='#f2a5c4'){const nums=values.map(Number).filter(Number.isFinite);if(nums.length<2)return'';const min=Math.min(...nums),max=Math.max(...nums),range=max-min||1,pts=nums.map((v,i)=>`${i/(nums.length-1)*100},${38-(v-min)/range*32}`).join(' ');return`<svg class="chart" viewBox="0 0 100 42" preserveAspectRatio="none" aria-label="Recent trend"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}

<div class="grow"><div class="title">${last?last.kg+' kg':'No weight logged'}</div><div class="meta">Optional—use only if helpful or requested by the care team.</div></div></div>${spark(weights.map(x=>x.kg))}<button class="btn" data-action="weight">Log weight</button></section><div class="section">Steps · last 14 logs</div><section class="card">${moves.length?spark(moves.map(x=>x.steps),'#e7c276'):'<div class="sub">No movement logs yet.</div>'}</section><div class="section">Data & privacy</div><section class="card"><div class="title">Stored only on this phone</div><div class="meta">About ${Math.ceil(new Blob([JSON.stringify(db)]).size/1024).toLocaleString()} KB · photos are compressed before saving</div><div class="btns" style="margin-top:.8rem"><button class="btn primary" data-action="export">Export backup</button><button class="btn" data-action="import">Restore</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden></section>`}

async function compressPhoto(file){if(file.size>12*1024*1024)throw Error('Please choose a photo under 12 MB.');const img=await createImageBitmap(file),scale=Math.min(1,512/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();return canvas.toDataURL('image/jpeg',.78)}
function wire(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>action(b.dataset.action,b,e));document.querySelectorAll('[data-open-journal]').forEach(b=>b.onclick=()=>{modal={type:'journal',id:b.dataset.openJournal};render()});document.querySelectorAll('[data-open-visit]').forEach(b=>b.onclick=()=>{modal={type:'visit',id:b.dataset.openVisit};render()});document.querySelectorAll('[data-water]').forEach(b=>b.onclick=()=>addWater(b.dataset.water));const custom=$('[data-action="custom-water"]');if(custom)custom.onclick=()=>{const ml=Number(prompt('How many ml?','250'));if(ml>0)addWater(ml)};const undo=$('[data-action="undo-water"]');if(undo)undo.onclick=undoWater;const bottle=$('[data-action="change-bottle"]');if(bottle)bottle.onclick=()=>{const size=Number(prompt('Bottle size in ml',String(db.profile.bottleSize)));if(Number.isFinite(size)&&size>=100&&size<=3000){db.profile.bottleSize=Math.round(size);save();render()}else if(size)alert('Enter a bottle size between 100 and 3,000 ml.')};const care=$('[data-action="care-history"]');if(care)care.onclick=()=>{modal={type:'care-history'};render()};const nutsHist=$('[data-action="nuts-history"]');if(nutsHist)nutsHist.onclick=()=>{modal={type:'nuts-history'};render()};document.querySelectorAll('[data-care-date]').forEach(b=>b.onclick=()=>toggleCare(b.dataset.careDate));document.querySelectorAll('[data-nuts-date]').forEach(b=>b.onclick=()=>toggleNuts(b.dataset.nutsDate));document.querySelectorAll('[data-delete-weight]').forEach(b=>b.onclick=()=>{if(confirm('Delete this weight entry?')){db.weights=db.weights.filter(x=>x.id!==b.dataset.deleteWeight);save();render()}});const file=$('#restoreFile');if(file)file.onchange=restore}
async function action(a,b,e){if(a==='settings'){modal={type:'settings'};render()}if(a==='close'){modal=null;render()}if(a==='backdrop'&&e.target===b){modal=null;render()}if(a==='remove-photo'){db.profile.photo='';save();render()}if(a==='save-settings'){const name=$('#pName').value.trim();if(!name){alert('Please add her name.');return}let photo=db.profile.photo,file=$('#profilePhoto').files[0];if(file){try{photo=await compressPhoto(file)}catch(err){alert(err.message);return}}db.profile={...db.profile,name,dueDate:$('#pDue').value,photo,prenatalLabel:$('#pPrenatal').value.trim()||'Daily prenatal care',prenatalTime:$('#pPrenatalTime').value||'09:00',soakedNutsLabel:$('#pNutsLabel').value.trim()||'Soaked nuts',soakedNutsTime:$('#pNutsTime').value||'07:00',waterGoal:Math.max(250,Math.min(10000,Number($('#pGoal').value)||2000)),bottleSize:Math.max(100,Math.min(3000,Number($('#pBottle').value)||500)),waterInterval:Number($('#pInterval').value)||120,waterStart:$('#pStart').value||'08:00',waterEnd:$('#pEnd').value||'20:00'};save();modal=null;render()}if(a==='prenatal'){const d=todayRecord();d.prenatalDone=d.prenatalDone?null:Date.now();save();render()}if(a==='soakednuts'){const d=todayRecord();d.soakedNutsDone=d.soakedNutsDone?null:Date.now();save();render()}if(a==='custom-water'){const ml=Number(prompt('How many ml?','250'));if(ml>0){const d=todayRecord();d.water=Math.min(20000,d.water+Math.min(3000,ml));save();render()}}if(a==='movement'){modal={type:'movement'};render()}if(a==='weight'||a==='add-trends'){modal={type:'weight'};render()}if(a==='add-journal'){modal={type:'journal'};render()}if(a==='add-visits'){modal={type:'visit'};render()}if(a==='save-journal'){const id=b.dataset.id,x=db.journal.find(x=>x.id===id),rec={id:id||uid(),date:$('#jDate').value||iso(),mood:$('#jMood').value,symptoms:$('#jSymptoms').value.trim(),note:$('#jNote').value.trim(),createdAt:x?.createdAt||Date.now(),updatedAt:Date.now()};x?Object.assign(x,rec):db.journal.push(rec);save();modal=null;render()}if(a==='delete-journal'&&confirm('Delete this journal entry?')){db.journal=db.journal.filter(x=>x.id!==b.dataset.id);save();modal=null;render()}if(a==='save-visit'){const id=b.dataset.id,x=db.appointments.find(x=>x.id===id),date=$('#vDate').value;if(!date){alert('Add the appointment date.');return}const rec={id:id||uid(),reason:$('#vReason').value.trim()||'Prenatal appointment',date,time:$('#vTime').value,provider:$('#vProvider').value.trim(),location:$('#vLocation').value.trim(),questions:$('#vQuestions').value.trim(),notes:$('#vNotes').value.trim(),status:$('#vStatus').value,createdAt:x?.createdAt||Date.now()};x?Object.assign(x,rec):db.appointments.push(rec);save();modal=null;render()}if(a==='delete-visit'&&confirm('Delete this appointment?')){db.appointments=db.appointments.filter(x=>x.id!==b.dataset.id);save();modal=null;render()}if(a==='save-movement'){const date=$('#mDate').value||iso(),x=db.movement.find(x=>x.date===date),n=id=>Math.max(0,Math.min(100000,Number($(id).value)||0)),rec={id:x?.id||uid(),date,steps:n('#mSteps'),walk:Math.min(600,n('#mWalk')),yoga:Math.min(600,n('#mYoga')),meditation:Math.min(600,n('#mMeditation')),other:Math.min(600,n('#mOther')),note:$('#mNote').value.trim()};x?Object.assign(x,rec):db.movement.push(rec);save();modal=null;render()}if(a==='save-weight'){const date=$('#wDate').value||iso(),kg=Number($('#wKg').value);if(!Number.isFinite(kg)||kg<1||kg>500){alert('Enter a valid weight in kilograms.');return}const x=db.weights.find(x=>x.date===date),rec={id:x?.id||uid(),date,kg:Math.round(kg*10)/10};x?Object.assign(x,rec):db.weights.push(rec);save();modal=null;render()}if(a==='notifications'){if(!('Notification'in window)){alert('Notifications are unavailable in this browser.');return}const permission=await Notification.requestPermission();if(permission==='granted'){await reminders();alert('Sakhi reminders are enabled. Keep Sakhi installed on the Home Screen.')}render()}if(a==='export'){const blob=new Blob([JSON.stringify({app:'Sakhi',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`sakhi-backup-${iso()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(a==='import')$('#restoreFile').click()}
async function restore(){const file=this.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text()),incoming=parsed.app==='Sakhi'?parsed.data:parsed;if(!incoming?.profile||!Array.isArray(incoming.daily)||!Array.isArray(incoming.journal))throw Error();if(!confirm('Replace all Sakhi data on this phone with this backup?'))return;db={...fresh(),...incoming,profile:{...EMPTY.profile,...incoming.profile}};save();render();alert('Sakhi backup restored.')}catch(e){alert('This is not a valid Sakhi backup.')}}
async function notify(title,body,tag){if(notificationPermission()!=='granted'||!('serviceWorker'in navigator))return;const reg=await navigator.serviceWorker.ready;(reg.active||navigator.serviceWorker.controller)?.postMessage({type:'notify',title,body,tag})}
function clock(v,f){const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');return m?Math.min(1439,+m[1]*60+ +m[2]):f}
async function reminders(){if(notificationPermission()!=='granted'||!db.profile.name)return;const now=new Date(),mins=now.getHours()*60+now.getMinutes(),d=todayRecord(),s=db.settings,day=iso(),care=clock(db.profile.prenatalTime,540);if(!d.prenatalDone&&mins>=care){const slot=Math.floor((mins-care)/60),key=`${day}-care-${slot}`;if(s.careNotice!==key){await notify(`${db.profile.name}: ${db.profile.prenatalLabel}`,'Please mark it done in Sakhi. If it stays open, Sakhi will remind again in one hour.','sakhi-care');s.careNotice=key;save()}}const nuts=clock(db.profile.soakedNutsTime,420);if(!d.soakedNutsDone&&mins>=nuts){const slot=Math.floor((mins-nuts)/60),key=`${day}-nuts-${slot}`;if(s.nutsNotice!==key){await notify(`${db.profile.name}: ${db.profile.soakedNutsLabel||'Soaked nuts'}`,'Please mark it done in Sakhi. Reminder repeats hourly until done.','sakhi-nuts');s.nutsNotice=key;save()}}const start=clock(db.profile.waterStart,480),end=clock(db.profile.waterEnd,1200),interval=Math.max(30,db.profile.waterInterval);if(mins>=start&&mins<=end&&d.water<db.profile.waterGoal){const slot=Math.floor((mins-start)/interval),key=`${day}-water-${slot}`;if(s.waterNotice!==key){await notify(`${db.profile.name}: Water reminder`,`${d.water.toLocaleString()} of ${db.profile.waterGoal.toLocaleString()} ml logged today.`,'sakhi-water');s.waterNotice=key;save()}}for(const v of db.appointments.filter(x=>x.status==='scheduled')){const when=new Date(`${v.date}T${v.time||'09:00'}:00`),hours=(when-now)/3600000,stage=hours>0&&hours<=2?'soon':hours>2&&hours<=26?'tomorrow':null,key=stage&&`${v.id}-${stage}`;if(key&&v.notice!==key){await notify(`${db.profile.name}: ${v.reason}`,`${stage==='soon'?'Coming up soon':'Upcoming'}: ${dateFmt(v.date)}${v.time?' at '+v.time:''}`,'sakhi-visit');v.notice=key;save()}}}
render();
if('serviceWorker'in navigator)window.addEventListener('load',async()=>{await navigator.serviceWorker.register('./sw.js').catch(()=>null);reminders()});
setInterval(reminders,60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reminders()});
</script></body></html>
