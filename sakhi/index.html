<style>
:root{--bg:#130b12;--surface:#21131e;--surface2:#2b1927;--border:#44283b;--text:#fff7fb;--muted:#bda8b5;--rose:#f2a5c4;--rose2:#d977a1;--gold:#e7c276;--mint:#78d8c1;--danger:#ff8b8b;--r:18px;--ui:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{font-size:15px;-webkit-text-size-adjust:100%}body{margin:0;color:var(--text);font-family:var(--ui);min-height:100vh;min-height:100dvh;background:var(--bg);background-image:radial-gradient(circle at 15% 5%,#5b2745 0,transparent 28rem),radial-gradient(circle at 100% 30%,#392136 0,transparent 24rem);background-attachment:fixed}button,input,select,textarea{font:inherit}.app{max-width:540px;margin:auto;min-height:100dvh;padding-bottom:calc(5rem + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;padding:calc(.75rem + env(safe-area-inset-top)) 1rem .75rem;background:linear-gradient(180deg,rgba(19,11,18,.96) 72%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:.65rem}.brand img{width:2.35rem;height:2.35rem;border-radius:12px}.brand h1{font-family:Georgia,serif;font-size:1.25rem;margin:0;color:#ffd8e8}.brand small{display:block;color:var(--muted);font-size:.68rem;margin-top:.05rem}.icon-btn{width:2.4rem;height:2.4rem;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text)}main{padding:0 1rem}
.profile{display:flex;align-items:center;gap:.9rem;padding:1rem;background:linear-gradient(135deg,rgba(100,42,76,.92),rgba(39,22,35,.95));border:1px solid #75415e;border-radius:22px;margin-bottom:.8rem;box-shadow:0 16px 40px rgba(0,0,0,.2)}.avatar{width:4rem;height:4rem;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.45);background:#6b3151;display:grid;place-items:center;font-size:1.7rem;flex:0 0 auto}.profile h2{margin:0;font-size:1.15rem}.profile p{margin:.2rem 0 0;color:#e6c8d7;font-size:.78rem;line-height:1.4}.week-badge{margin-left:auto;text-align:center;background:rgba(20,8,17,.4);padding:.45rem .6rem;border-radius:12px}.week-badge b{display:block;color:#ffd2e5;font-size:1.1rem}.week-badge span{font-size:.6rem;color:#d8b4c6;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:.35rem;background:rgba(33,19,30,.9);border:1px solid var(--border);padding:.3rem;border-radius:14px;margin-bottom:.8rem;position:sticky;top:4.4rem;z-index:8}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:.58rem .2rem;border-radius:10px;font-weight:700;font-size:.78rem}.tabs button.active{background:var(--rose);color:#3b1428}.card{background:rgba(33,19,30,.93);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:.75rem;box-shadow:0 10px 26px rgba(0,0,0,.12)}.milestone{background:linear-gradient(145deg,rgba(87,38,67,.96),rgba(33,19,30,.95))}.eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--rose);font-weight:800}.card h3{font-size:1rem;margin:.35rem 0}.sub{font-size:.77rem;color:var(--muted);line-height:1.5}.quote{text-align:center;padding:1.1rem 1.35rem}.quote q{font-family:Georgia,serif;font-size:.98rem;line-height:1.55;color:#ffe4ef}.section{font-size:.67rem;text-transform:uppercase;letter-spacing:.12em;color:#c7aab8;font-weight:800;margin:1.05rem .15rem .5rem}.row{display:flex;align-items:center;gap:.65rem}.grow{flex:1;min-width:0}.title{font-weight:750;font-size:.9rem}.meta{font-size:.72rem;color:var(--muted);margin-top:.18rem;line-height:1.4}.value{font-weight:800;color:var(--rose);white-space:nowrap}.pill{font-size:.64rem;text-transform:uppercase;font-weight:800;padding:.25rem .55rem;border-radius:999px;background:#40304b;color:#d8bfff}.pill.done{background:#21463f;color:#91e6d1}.progress{height:.5rem;background:var(--surface2);border-radius:99px;overflow:hidden;margin:.8rem 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rose2),var(--rose));border-radius:99px}.btn{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:.74rem .75rem;font-weight:750}.btn.primary{background:var(--rose);border-color:var(--rose);color:#3b1428}.btn.ghost{background:transparent}.btn.danger{background:transparent;color:var(--danger);border-color:#6a343d}.btns{display:flex;gap:.5rem}.btns .btn{flex:1}.stats{display:flex;gap:.5rem}.stat{flex:1;text-align:center;background:var(--surface2);padding:.7rem .3rem;border-radius:12px}.stat b{display:block;color:var(--rose);font-size:1rem}.stat span{font-size:.58rem;color:var(--muted);text-transform:uppercase}.chart{width:100%;height:4.2rem;display:block;margin-top:.4rem}.empty{text-align:center;color:var(--muted);padding:2rem 1rem}.empty b{display:block;color:var(--text);margin:.3rem}.list-item{padding:.82rem 0;border-bottom:1px solid var(--border);cursor:pointer}.list-item:last-child{border:0}.fab{position:fixed;z-index:15;right:max(1rem,calc((100vw - 540px)/2 + 1rem));bottom:calc(1rem + env(safe-area-inset-bottom));border:0;background:var(--rose);color:#3b1428;border-radius:999px;padding:.8rem 1.05rem;font-weight:850;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(8,3,7,.72);display:flex;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:540px;max-height:90vh;overflow:auto;background:#21131e;border:1px solid var(--border);border-radius:24px 24px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom))}.handle{width:2.5rem;height:.28rem;border-radius:99px;background:#664257;margin:0 auto .9rem}.modal h2{margin:0 0 1rem;font-size:1.1rem}.field{margin-bottom:.8rem}.field label{display:block;color:var(--muted);font-size:.72rem;font-weight:700;margin-bottom:.32rem}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:.68rem}.field textarea{min-height:5rem;resize:vertical}.hint{font-size:.67rem;color:var(--muted);line-height:1.4;margin-top:.3rem}.photo-preview{width:5rem;height:5rem;border-radius:50%;object-fit:cover;border:2px solid var(--rose)}.privacy{font-size:.68rem;color:var(--muted);line-height:1.45}.notice{border-left:3px solid var(--gold);padding:.65rem .75rem;background:#30251f;color:#e9d7b0;border-radius:8px;font-size:.72rem;line-height:1.45}
html,body{overflow-x:hidden}.app{width:100%;overflow-x:hidden}main{width:100%;overflow-x:hidden}.brand,.field,.btns>*{min-width:0}.brand small,.card h2,.card h3,.card p,.sub,.meta,.title,.hint,.privacy,.notice{overflow-wrap:anywhere}.card,.notice{max-width:100%;overflow:hidden}.tabs button,.stat{min-width:0}.field input,.field textarea,.field select{min-width:0;max-width:100%}
.card,.notice,.tabs,.profile{width:calc(100vw - 2rem);max-width:508px}
@media(max-width:360px){.stats{gap:.3rem}.stat{padding:.6rem .15rem}.btns{gap:.35rem}.tabs button{font-size:.7rem}.week-badge{display:none}}

<body><div id="app" class="app"></div>
<script>
const KEY='sakhi_pregnancy_v1';
const LIMITS={daily:500,journal:750,appointments:300,movement:500,weights:300};
const EMPTY={profile:{name:'',dueDate:'',photo:'',prenatalLabel:'Prenatal vitamin',prenatalTime:'09:00',waterGoal:2000,bottleSize:500,waterInterval:120,waterStart:'08:00',waterEnd:'20:00'},daily:[],journal:[],appointments:[],movement:[],weights:[],settings:{}};
function fresh(){return JSON.parse(JSON.stringify(EMPTY))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?{...fresh(),...x,profile:{...EMPTY.profile,...x.profile}}:fresh()}catch(e){return fresh()}}
let db=load(),tab='today',modal=null;
function trimData(){Object.entries(LIMITS).forEach(([k,n])=>{if(!Array.isArray(db[k]))db[k]=[];db[k]=db[k].slice(-n)})}
function save(){trimData();try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Sakhi could not save because browser storage is full. Export a backup, then remove older entries or the profile photo.');return false}}
const $=s=>document.querySelector(s), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function iso(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function dateFmt(x){return new Date(x+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function weekInfo(){if(!db.profile.dueDate)return null;const remaining=Math.round((new Date(db.profile.dueDate+'T12:00:00')-new Date(iso()+'T12:00:00'))/86400000);const elapsed=Math.max(0,280-remaining);return{week:Math.max(0,Math.min(42,Math.floor(elapsed/7))),day:elapsed%7,remaining:Math.max(0,remaining)}}
const SIZES=['poppy seed','sesame seed','lentil','blueberry','raspberry','grape','kumquat','fig','lime','lemon','peach','apple','avocado','pear','bell pepper','mango','banana','carrot','papaya','grapefruit','ear of corn','rutabaga','zucchini','cauliflower','eggplant','butternut squash','cabbage','coconut','jicama','pineapple','cantaloupe','honeydew melon','head of romaine','bunch of Swiss chard','leek','small watermelon','pumpkin'];
const NOTES=['A tiny beginning is settling in and starting an extraordinary journey.','Early support structures are developing while baby remains wonderfully small.','Foundations for the brain, spine, and heart are beginning to take shape.','Small limb buds and early facial structures are beginning to emerge.','Early organs and tiny fingers and toes continue developing.','The body is lengthening and early structures are becoming more recognizable.','Limbs and joints continue forming while internal systems develop.','Tiny movements may begin even though they cannot be felt yet.','Major structures are present and will keep growing and refining.','Bones are beginning to harden and the body is becoming more proportioned.','The neck and lower limbs are more defined as movement develops.','Hearing structures and facial features continue refining.','Growth is steady while bones, lungs, and movement mature.','Movement is becoming more coordinated as the nervous system develops.','Hearing continues developing and the body is growing stronger.','Facial features may be visible during an ultrasound.','The digestive system is active and a soft protective covering is developing.','Kicks and turns are getting stronger as muscles develop.','Sucking practice and hand-to-mouth movements may be happening.','Fingerprints and footprints are beginning to form.','The lungs continue maturing while the body gradually adds fat.','Responses to familiar sounds and voices may become noticeable.','The nervous system and lungs continue their important development.','The eyes may open and close as more body fat develops.','Movements are stronger and the skin is becoming smoother.','Stretching, kicking, and grasping motions have more strength.','The eyes can notice changes in light while rapid growth continues.','Bone marrow is taking on more blood-cell production.','Major development is advanced and steady weight gain becomes a focus.','The brain is developing rapidly while the body fills out.','Bones strengthen while the skull stays flexible for birth.','Fingernails are reaching the fingertips and limbs look rounder.','Many babies begin settling into a head-down position around this stage.','The lungs, brain, and nervous system continue developing.','The body keeps adding fat for warmth after birth.','Space is snug, but the usual pattern of movement should continue.','Around the estimated due date, baby is getting ready to meet the family.'];
const QUOTES=[
'Today only asks for today.','Small acts of care are already acts of love.','Rest is productive when a body is building new life.','You do not need to do everything—just the next gentle thing.','There is strength in moving slowly and listening inward.','Every ordinary day is part of an extraordinary story.','Let care be simple: breathe, drink, rest, and begin again.','Your pace is the right pace for this season.','A quiet moment can be enough for today.','Progress can look like rest, patience, and one checked box.','Be as kind to yourself as you already are to this little life.','One day, one week, one loving step at a time.','You are allowed to feel grateful and tired at the same time.','There is no perfect day—only a cared-for one.','Your body is doing important work, even on the quietest days.','Baby is growing in moments you can see and moments you cannot.','Motherhood can be tender, messy, tiring, and beautiful all at once.','Each gentle breath is a small return to yourself.','You and baby are already learning a rhythm together.','Resting is one way of caring for the whole family.','Love is making room before the new little one arrives.','Your growing family is being built in ordinary moments.','Your three-year-old is becoming an older sibling one day at a time.','A sibling story begins long before the first hello.','Little hands may soon reach for even littler hands.','This baby already has an older sibling waiting in the story.','A family does not need perfect days to grow strong roots.','Your home is growing in love before it grows in noise.','One child taught your heart to love; another will show it new rooms.','There is room in your heart for every version of motherhood.','An older sibling’s questions are another way love gets ready.','A cuddle with your three-year-old is care for both of you.','Pregnancy and parenting can share the same gentle day.','What you managed today is enough for today.','Some days glow; other days simply carry you forward.','Gentle choices still count as meaningful progress.','A cup of water can be a quiet promise to yourself.','One completed reminder is worth celebrating.','A single journal line can hold a whole day.','Every question saved for an appointment is an act of care.','Asking for help is part of caring for your family.','Support turns a heavy day into a shared one.','You deserve to receive care as freely as you give it.','Feeling tired is not the same as falling short.','A slow day can still be full of growth.','Patience with yourself is part of preparing for baby.','Your body is adapting; your kindness can adapt with it.','Baby needs a cared-for mother, not a perfect one.','Kindness can be the most useful routine of the day.','One peaceful minute belongs entirely to you.','Inhale a little calm; exhale a little pressure.','A hand on your belly can be a tiny family gathering.','One smile from your three-year-old can soften a long day.','The memories forming now may be simple, but they are still precious.','Your older child is not losing love; the family is growing more of it.','A new baby does not replace an old rhythm—it adds another beat.','Sibling bonds begin with stories, questions, and patient little moments.','Preparing for baby is more about love than having every item ready.','You are allowed to ask the same question more than once.','You are allowed to have more than one feeling at a time.','Excitement and uncertainty can sit beside each other.','Being strong does not mean never needing rest.','Receiving care is a form of strength.','Listening to your body is useful, not selfish.','A gentle boundary can protect a peaceful day.','A nap can be part of the plan.','A simple meal and a quiet evening can be plenty.','A few mindful steps can make space for a calmer breath.','Every sip is a small pause for care.','Meditation needs only one moment of attention.','Movement can be gentle, joyful, and guided by what feels right today.','Each new week is one more page in your family’s story.','Milestones are reminders to wonder, not deadlines to compare.','A due date is a guide; love does not follow a calendar.','Every baby grows along a story uniquely their own.','Every mother moves through pregnancy in her own way.','You do not need to compare this pregnancy with anyone else’s.','Today is a life being lived, not a checklist to finish.','A missed task can wait; tomorrow offers another beginning.','A reminder is an invitation to care, not a reason for guilt.','Notice what you completed before noticing what remains.','Your three-year-old can help in tiny ways and still feel important.','Baby stories make room for an older child’s curiosity and love.','Save the questions that matter; you do not have to hold them all in mind.','You do not need a photograph for a moment to matter.','A quiet journal entry can become a gift to your future self.','Family laughter is preparation too.','Love does not divide when a family grows—it learns to multiply.','The arms that hold your first child are learning another welcome.','Your home’s sounds may change, but its center can remain love.','One day, your children may share a joke only siblings understand.','For today, baby is close and your three-year-old is close enough to hug.','Motherhood is expanding, not starting over.','A growing family is teamwork made from many small kindnesses.','Let someone help with one thing today.','Come back to one slow breath whenever the day feels crowded.','This season is temporary, even when a day feels long.','You are already enough for the family growing around you.','Tomorrow brings a new thought; today can keep this gentle one.','You are growing a baby, a family, and a new version of yourself.'
];
function todayRecord(){let x=db.daily.find(x=>x.date===iso());if(!x){x={date:iso(),water:0,prenatalDone:null};db.daily.push(x)}return x}
function quote(){return QUOTES[Math.floor(new Date(iso()+'T12:00:00').getTime()/86400000)%QUOTES.length]}
function spark(values,color='#f2a5c4'){const nums=values.map(Number).filter(Number.isFinite);if(nums.length<2)return'';const min=Math.min(...nums),max=Math.max(...nums),range=max-min||1,pts=nums.map((v,i)=>`${i/(nums.length-1)*100},${38-(v-min)/range*32}`).join(' ');return`<svg class="chart" viewBox="0 0 100 42" preserveAspectRatio="none" aria-label="Recent trend"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function header(){const w=weekInfo(),photo=db.profile.photo?`<img class="avatar" src="${db.profile.photo}" alt="Profile">`:`<div class="avatar">🌸</div>`;return`<header class="top"><div class="brand"><img src="./icon-192.png" alt=""><div><h1>Sakhi</h1><small>Your gentle pregnancy companion</small></div></div><button class="icon-btn" data-action="settings" aria-label="Settings">⚙</button></header><main>${db.profile.name?`<section class="profile">${photo}<div class="grow"><h2>${esc(db.profile.name)}</h2><p>${w?`${w.remaining} days to the estimated due date`:'Add the estimated due date'}</p></div>${w?`<div class="week-badge"><b>${w.week}+${w.day}</b><span>week</span></div>`:''}</section>`:''}<nav class="tabs">${[['today','Today'],['journal','Journal'],['visits','Visits'],['trends','Trends']].map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'active':''}">${x[1]}</button>`).join('')}</nav>`}
function render(){if(!db.profile.name){$('#app').innerHTML=welcome()+(modal?modalView():'');wire();return}let body=tab==='today'?todayView():tab==='journal'?journalView():tab==='visits'?visitsView():trendsView();$('#app').innerHTML=header()+body+'</main>'+(tab!=='today'?`<button class="fab" data-action="add-${tab}">＋ Add</button>`:'')+(modal?modalView():'');wire()}
function welcome(){return`<header class="top"><div class="brand"><img src="./icon-192.png"><div><h1>Sakhi</h1><small>Your gentle pregnancy companion</small></div></div></header><main><div class="card" style="text-align:center;margin-top:2rem;padding:1.5rem"><img src="./icon-512.png" style="width:7rem;border-radius:28px" alt="Sakhi"><h2 style="font-family:Georgia,serif;color:#ffd8e8">A calm space for this journey</h2><p class="sub">Gentle reminders, hydration, movement, journals, appointments, and weekly moments—without an overwhelming checklist.</p><button class="btn primary" data-action="settings">Create her profile</button><p class="privacy">Everything stays on this phone unless she exports a private backup.</p></div><div class="notice">Sakhi is an organizer, not medical advice. Follow the obstetric care team’s guidance and contact them for concerning symptoms.</div></main>`}
function notificationPermission(){return 'Notification'in window?Notification.permission:'unsupported'}
function todayView(){const d=todayRecord(),w=weekInfo(),week=Math.max(4,Math.min(40,w?.week||4)),i=week-4,size=SIZES[i],movement=db.movement.find(x=>x.date===iso())||{},goal=db.profile.waterGoal||2000,pct=Math.min(100,Math.round(d.water/goal*100)),next=[...db.appointments].filter(x=>x.status==='scheduled'&&x.date>=iso()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0],permission=notificationPermission();return`${w?`<section class="card milestone"><div class="eyebrow">Week ${week}</div><h3>Baby is about the size of ${/^[aeiou]/i.test(size)?'an':'a'} ${size}</h3><div class="sub">${NOTES[i]}</div><div class="hint">A playful comparison only—growth varies and clinical measurements are different.</div></section>`:''}<section class="card quote"><q>${quote()}</q><div class="eyebrow" style="margin-top:.65rem">Today’s gentle thought</div></section><div class="section">Daily care</div><section class="card"><div class="row"><div class="grow"><div class="title">${esc(db.profile.prenatalLabel)}</div><div class="meta">Scheduled ${db.profile.prenatalTime} · hourly reminder until done</div></div><span class="pill ${d.prenatalDone?'done':''}">${d.prenatalDone?'Done':'Due'}</span></div><div style="height:.75rem"></div><button class="btn ${d.prenatalDone?'ghost':'primary'}" data-action="prenatal">${d.prenatalDone?'Marked done · Undo':'Mark done today'}</button></section><section class="card"><div class="row"><div class="grow"><div class="title">Water</div><div class="meta">${goal.toLocaleString()} ml goal · ${db.profile.bottleSize} ml bottle</div></div><div class="value">${d.water.toLocaleString()} ml</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="btns"><button class="btn" data-water="250">+250 ml</button><button class="btn primary" data-water="${db.profile.bottleSize}">+ Bottle</button><button class="btn" data-action="custom-water">Other</button></div></section><section class="card"><div class="row"><div class="grow"><div class="title">Movement & calm</div><div class="meta">Only activities approved by her care professional</div></div></div><div class="stats" style="margin:.8rem 0"><div class="stat"><b>${(movement.steps||0).toLocaleString()}</b><span>Steps</span></div><div class="stat"><b>${movement.yoga||0}</b><span>Yoga min</span></div><div class="stat"><b>${movement.meditation||0}</b><span>Meditation</span></div></div><button class="btn" data-action="movement">Log today</button></section><button class="btn ${permission==='granted'?'':'primary'}" data-action="notifications">${permission==='granted'?'Notifications enabled':permission==='unsupported'?'Reminders unavailable':'Enable reminders'}</button><p class="privacy">Browser reminders run while Sakhi is active and catch up when reopened. Guaranteed closed-app delivery would require a future push service.</p><div class="section">Next appointment</div>${next?`<section class="card" data-open-visit="${next.id}"><div class="title">${esc(next.reason)}</div><div class="meta">${dateFmt(next.date)}${next.time?' · '+next.time:''}${next.provider?' · '+esc(next.provider):''}</div></section>`:`<div class="empty">📅<b>No visit scheduled</b>Add the next appointment when ready.</div>`}`}
function journalView(){const list=[...db.journal].sort((a,b)=>b.createdAt-a.createdAt);return list.length?list.map(x=>`<section class="card" data-open-journal="${x.id}"><div class="title">${dateFmt(x.date)}${x.mood?' · '+esc(x.mood):''}</div><div class="meta">${esc((x.note||x.symptoms||'').slice(0,100))}</div></section>`).join(''):`<div class="empty">📖<b>The journal is ready</b>One sentence is enough.</div>`}
function visitsView(){const list=[...db.appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return list.length?list.map(x=>`<section class="card" data-open-visit="${x.id}"><div class="row"><div class="grow"><div class="title">${esc(x.reason)}</div><div class="meta">${dateFmt(x.date)}${x.time?' · '+x.time:''}${x.provider?' · '+esc(x.provider):''}</div></div><span class="pill ${x.status==='completed'?'done':''}">${x.status}</span></div></section>`).join(''):`<div class="empty">🗓️<b>No appointments yet</b>Keep visit details and questions together.</div>`}
function trendsView(){const water=[...db.daily].sort((a,b)=>a.date.localeCompare(b.date)).slice(-14),weights=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-20),moves=[...db.movement].sort((a,b)=>a.date.localeCompare(b.date)).slice(-14),last=weights[weights.length-1];return`<div class="section">Water · last 14 logs</div><section class="card"><div class="row"><div class="title grow">Hydration trend</div><div class="value">${water.length?water[water.length-1].water.toLocaleString()+' ml':'—'}</div></div>${spark(water.map(x=>x.water),'#78d8c1')}</section><div class="section">Weight</div><section class="card"><div class="row"><div class="grow"><div class="title">${last?last.kg+' kg':'No weight logged'}</div><div class="meta">Optional—use only if helpful or requested by the care team.</div></div></div>${spark(weights.map(x=>x.kg))}<button class="btn" data-action="weight">Log weight</button></section><div class="section">Steps · last 14 logs</div><section class="card">${moves.length?spark(moves.map(x=>x.steps),'#e7c276'):'<div class="sub">No movement logs yet.</div>'}</section><div class="section">Data & privacy</div><section class="card"><div class="title">Stored only on this phone</div><div class="meta">About ${Math.ceil(new Blob([JSON.stringify(db)]).size/1024).toLocaleString()} KB · photos are compressed before saving</div><div class="btns" style="margin-top:.8rem"><button class="btn primary" data-action="export">Export backup</button><button class="btn" data-action="import">Restore</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden></section>`}
function modalView(){let body='';if(modal.type==='settings')body=settingsModal();if(modal.type==='journal')body=journalModal();if(modal.type==='visit')body=visitModal();if(modal.type==='movement')body=movementModal();if(modal.type==='weight')body=weightModal();return`<div class="overlay" data-action="backdrop"><div class="modal"><div class="handle"></div>${body}</div></div>`}
function settingsModal(){const p=db.profile;return`<h2>${p.name?'Profile & reminders':'Welcome to Sakhi'}</h2><div class="row" style="margin-bottom:.8rem">${p.photo?`<img class="photo-preview" src="${p.photo}">`:`<div class="avatar">🌸</div>`}<div class="field grow" style="margin:0"><label>Profile photo (optional)</label><input id="profilePhoto" type="file" accept="image/*"><div class="hint">Compressed to a small 512 px image; the original is never saved.</div></div></div>${p.photo?`<button class="btn ghost" data-action="remove-photo" style="margin-bottom:.8rem">Remove photo</button>`:''}<div class="field"><label>Her name</label><input id="pName" maxlength="60" value="${esc(p.name)}"></div><div class="field"><label>Estimated due date</label><input id="pDue" type="date" value="${p.dueDate}"></div><div class="section">Daily care reminder</div><div class="field"><label>Label from her care plan</label><input id="pPrenatal" maxlength="80" value="${esc(p.prenatalLabel)}"></div><div class="field"><label>Time</label><input id="pPrenatalTime" type="time" value="${p.prenatalTime}"></div><div class="section">Water</div><div class="btns"><div class="field grow"><label>Daily goal (ml)</label><input id="pGoal" type="number" min="250" max="10000" step="50" value="${p.waterGoal}"></div><div class="field grow"><label>Bottle (ml)</label><input id="pBottle" type="number" min="100" max="3000" step="50" value="${p.bottleSize}"></div></div><div class="field"><label>Reminder interval</label><select id="pInterval">${[60,90,120,180,240].map(n=>`<option value="${n}" ${n===p.waterInterval?'selected':''}>${n/60} hour${n===60?'':'s'}</option>`).join('')}</select></div><div class="btns"><div class="field grow"><label>Start</label><input id="pStart" type="time" value="${p.waterStart}"></div><div class="field grow"><label>Stop</label><input id="pEnd" type="time" value="${p.waterEnd}"></div></div><button class="btn primary" data-action="save-settings">Save profile</button><div style="height:.5rem"></div><button class="btn ghost" data-action="close">Cancel</button>`}
function journalModal(){const x=modal.id?db.journal.find(x=>x.id===modal.id):null;return`<h2>${x?'Edit':'New'} journal entry</h2><div class="field"><label>Date</label><input id="jDate" type="date" value="${x?.date||iso()}"></div><div class="field"><label>How today feels</label><select id="jMood"><option value="">Choose</option>${['Good','Calm','Tired','Nauseous','Anxious','Emotional','Unwell'].map(v=>`<option ${x?.mood===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Symptoms or changes</label><textarea id="jSymptoms" maxlength="1000">${esc(x?.symptoms||'')}</textarea></div><div class="field"><label>Thoughts, gratitude, or questions</label><textarea id="jNote" maxlength="3000" style="min-height:8rem">${esc(x?.note||'')}</textarea></div><button class="btn primary" data-action="save-journal" data-id="${x?.id||''}">Save entry</button>${x?`<div style="height:.5rem"></div><button class="btn danger" data-action="delete-journal" data-id="${x.id}">Delete</button>`:''}<div style="height:.5rem"></div><button class="btn ghost" data-action="close">Cancel</button>`}
function visitModal(){const x=modal.id?db.appointments.find(x=>x.id===modal.id):null;return`<h2>${x?'Edit':'Add'} appointment</h2><div class="field"><label>Visit or purpose</label><input id="vReason" maxlength="100" value="${esc(x?.reason||'Prenatal appointment')}"></div><div class="btns"><div class="field grow"><label>Date</label><input id="vDate" type="date" value="${x?.date||iso()}"></div><div class="field grow"><label>Time</label><input id="vTime" type="time" value="${x?.time||''}"></div></div><div class="field"><label>Doctor, midwife, or clinic</label><input id="vProvider" maxlength="100" value="${esc(x?.provider||'')}"></div><div class="field"><label>Location</label><input id="vLocation" maxlength="160" value="${esc(x?.location||'')}"></div><div class="field"><label>Questions to ask</label><textarea id="vQuestions" maxlength="2000">${esc(x?.questions||'')}</textarea></div><div class="field"><label>Visit notes and follow-up</label><textarea id="vNotes" maxlength="3000">${esc(x?.notes||'')}</textarea></div><div class="field"><label>Status</label><select id="vStatus">${['scheduled','completed','cancelled'].map(v=>`<option ${x?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><button class="btn primary" data-action="save-visit" data-id="${x?.id||''}">Save appointment</button>${x?`<div style="height:.5rem"></div><button class="btn danger" data-action="delete-visit" data-id="${x.id}">Delete</button>`:''}<div style="height:.5rem"></div><button class="btn ghost" data-action="close">Cancel</button>`}
function movementModal(){const x=db.movement.find(x=>x.date===iso())||{};return`<h2>Movement & calm</h2><div class="field"><label>Date</label><input id="mDate" type="date" value="${x.date||iso()}"></div><div class="field"><label>Steps</label><input id="mSteps" type="number" inputmode="numeric" min="0" max="100000" value="${x.steps??''}"></div><div class="btns"><div class="field grow"><label>Walking (min)</label><input id="mWalk" type="number" min="0" max="600" value="${x.walk??''}"></div><div class="field grow"><label>Prenatal yoga (min)</label><input id="mYoga" type="number" min="0" max="600" value="${x.yoga??''}"></div></div><div class="btns"><div class="field grow"><label>Meditation (min)</label><input id="mMeditation" type="number" min="0" max="600" value="${x.meditation??''}"></div><div class="field grow"><label>Other approved exercise</label><input id="mOther" type="number" min="0" max="600" value="${x.other??''}"></div></div><div class="field"><label>How it felt</label><textarea id="mNote" maxlength="1000">${esc(x.note||'')}</textarea></div><div class="notice">Only do activities approved by her obstetric care professional. Stop and contact the care team for concerning symptoms.</div><div style="height:.7rem"></div><button class="btn primary" data-action="save-movement">Save log</button><div style="height:.5rem"></div><button class="btn ghost" data-action="close">Cancel</button>`}
function weightModal(){const list=[...db.weights].sort((a,b)=>b.date.localeCompare(a.date));return`<h2>Weight</h2><div class="btns"><div class="field grow"><label>Date</label><input id="wDate" type="date" value="${iso()}"></div><div class="field grow"><label>Weight (kg)</label><input id="wKg" type="number" inputmode="decimal" step="0.1" min="1" max="500"></div></div><button class="btn primary" data-action="save-weight">Save weight</button>${list.length?`<div class="section">Recent</div>${list.slice(0,12).map(x=>`<div class="list-item row"><div class="grow">${dateFmt(x.date)}</div><div class="value">${x.kg} kg</div><button class="icon-btn" data-delete-weight="${x.id}">×</button></div>`).join('')}`:''}<div style="height:.5rem"></div><button class="btn ghost" data-action="close">Close</button>`}
async function compressPhoto(file){if(file.size>12*1024*1024)throw Error('Please choose a photo under 12 MB.');const img=await createImageBitmap(file),scale=Math.min(1,512/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();return canvas.toDataURL('image/jpeg',.78)}
function wire(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>action(b.dataset.action,b,e));document.querySelectorAll('[data-open-journal]').forEach(b=>b.onclick=()=>{modal={type:'journal',id:b.dataset.openJournal};render()});document.querySelectorAll('[data-open-visit]').forEach(b=>b.onclick=()=>{modal={type:'visit',id:b.dataset.openVisit};render()});document.querySelectorAll('[data-water]').forEach(b=>b.onclick=()=>{const d=todayRecord();d.water=Math.min(20000,d.water+Number(b.dataset.water));save();render()});document.querySelectorAll('[data-delete-weight]').forEach(b=>b.onclick=()=>{if(confirm('Delete this weight entry?')){db.weights=db.weights.filter(x=>x.id!==b.dataset.deleteWeight);save();render()}});const file=$('#restoreFile');if(file)file.onchange=restore}
async function action(a,b,e){if(a==='settings'){modal={type:'settings'};render()}if(a==='close'){modal=null;render()}if(a==='backdrop'&&e.target===b){modal=null;render()}if(a==='remove-photo'){db.profile.photo='';save();render()}if(a==='save-settings'){const name=$('#pName').value.trim();if(!name){alert('Please add her name.');return}let photo=db.profile.photo,file=$('#profilePhoto').files[0];if(file){try{photo=await compressPhoto(file)}catch(err){alert(err.message);return}}db.profile={...db.profile,name,dueDate:$('#pDue').value,photo,prenatalLabel:$('#pPrenatal').value.trim()||'Daily prenatal care',prenatalTime:$('#pPrenatalTime').value||'09:00',waterGoal:Math.max(250,Math.min(10000,Number($('#pGoal').value)||2000)),bottleSize:Math.max(100,Math.min(3000,Number($('#pBottle').value)||500)),waterInterval:Number($('#pInterval').value)||120,waterStart:$('#pStart').value||'08:00',waterEnd:$('#pEnd').value||'20:00'};save();modal=null;render()}if(a==='prenatal'){const d=todayRecord();d.prenatalDone=d.prenatalDone?null:Date.now();save();render()}if(a==='custom-water'){const ml=Number(prompt('How many ml?','250'));if(ml>0){const d=todayRecord();d.water=Math.min(20000,d.water+Math.min(3000,ml));save();render()}}if(a==='movement'){modal={type:'movement'};render()}if(a==='weight'||a==='add-trends'){modal={type:'weight'};render()}if(a==='add-journal'){modal={type:'journal'};render()}if(a==='add-visits'){modal={type:'visit'};render()}if(a==='save-journal'){const id=b.dataset.id,x=db.journal.find(x=>x.id===id),rec={id:id||uid(),date:$('#jDate').value||iso(),mood:$('#jMood').value,symptoms:$('#jSymptoms').value.trim(),note:$('#jNote').value.trim(),createdAt:x?.createdAt||Date.now(),updatedAt:Date.now()};x?Object.assign(x,rec):db.journal.push(rec);save();modal=null;render()}if(a==='delete-journal'&&confirm('Delete this journal entry?')){db.journal=db.journal.filter(x=>x.id!==b.dataset.id);save();modal=null;render()}if(a==='save-visit'){const id=b.dataset.id,x=db.appointments.find(x=>x.id===id),date=$('#vDate').value;if(!date){alert('Add the appointment date.');return}const rec={id:id||uid(),reason:$('#vReason').value.trim()||'Prenatal appointment',date,time:$('#vTime').value,provider:$('#vProvider').value.trim(),location:$('#vLocation').value.trim(),questions:$('#vQuestions').value.trim(),notes:$('#vNotes').value.trim(),status:$('#vStatus').value,createdAt:x?.createdAt||Date.now()};x?Object.assign(x,rec):db.appointments.push(rec);save();modal=null;render()}if(a==='delete-visit'&&confirm('Delete this appointment?')){db.appointments=db.appointments.filter(x=>x.id!==b.dataset.id);save();modal=null;render()}if(a==='save-movement'){const date=$('#mDate').value||iso(),x=db.movement.find(x=>x.date===date),n=id=>Math.max(0,Math.min(100000,Number($(id).value)||0)),rec={id:x?.id||uid(),date,steps:n('#mSteps'),walk:Math.min(600,n('#mWalk')),yoga:Math.min(600,n('#mYoga')),meditation:Math.min(600,n('#mMeditation')),other:Math.min(600,n('#mOther')),note:$('#mNote').value.trim()};x?Object.assign(x,rec):db.movement.push(rec);save();modal=null;render()}if(a==='save-weight'){const date=$('#wDate').value||iso(),kg=Number($('#wKg').value);if(!Number.isFinite(kg)||kg<1||kg>500){alert('Enter a valid weight in kilograms.');return}const x=db.weights.find(x=>x.date===date),rec={id:x?.id||uid(),date,kg:Math.round(kg*10)/10};x?Object.assign(x,rec):db.weights.push(rec);save();modal=null;render()}if(a==='notifications'){if(!('Notification'in window)){alert('Notifications are unavailable in this browser.');return}const permission=await Notification.requestPermission();if(permission==='granted'){await reminders();alert('Sakhi reminders are enabled. Keep Sakhi installed on the Home Screen.')}render()}if(a==='export'){const blob=new Blob([JSON.stringify({app:'Sakhi',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`sakhi-backup-${iso()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(a==='import')$('#restoreFile').click()}
async function restore(){const file=this.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text()),incoming=parsed.app==='Sakhi'?parsed.data:parsed;if(!incoming?.profile||!Array.isArray(incoming.daily)||!Array.isArray(incoming.journal))throw Error();if(!confirm('Replace all Sakhi data on this phone with this backup?'))return;db={...fresh(),...incoming,profile:{...EMPTY.profile,...incoming.profile}};save();render();alert('Sakhi backup restored.')}catch(e){alert('This is not a valid Sakhi backup.')}}
async function notify(title,body,tag){if(notificationPermission()!=='granted'||!('serviceWorker'in navigator))return;const reg=await navigator.serviceWorker.ready;(reg.active||navigator.serviceWorker.controller)?.postMessage({type:'notify',title,body,tag})}
function clock(v,f){const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');return m?Math.min(1439,+m[1]*60+ +m[2]):f}
async function reminders(){if(notificationPermission()!=='granted'||!db.profile.name)return;const now=new Date(),mins=now.getHours()*60+now.getMinutes(),d=todayRecord(),s=db.settings,day=iso(),care=clock(db.profile.prenatalTime,540);if(!d.prenatalDone&&mins>=care){const slot=Math.floor((mins-care)/60),key=`${day}-care-${slot}`;if(s.careNotice!==key){await notify(`${db.profile.name}: ${db.profile.prenatalLabel}`,'Please mark it done in Sakhi. If it stays open, Sakhi will remind again in one hour.','sakhi-care');s.careNotice=key;save()}}const start=clock(db.profile.waterStart,480),end=clock(db.profile.waterEnd,1200),interval=Math.max(30,db.profile.waterInterval);if(mins>=start&&mins<=end&&d.water<db.profile.waterGoal){const slot=Math.floor((mins-start)/interval),key=`${day}-water-${slot}`;if(s.waterNotice!==key){await notify(`${db.profile.name}: Water reminder`,`${d.water.toLocaleString()} of ${db.profile.waterGoal.toLocaleString()} ml logged today.`,'sakhi-water');s.waterNotice=key;save()}}for(const v of db.appointments.filter(x=>x.status==='scheduled')){const when=new Date(`${v.date}T${v.time||'09:00'}:00`),hours=(when-now)/3600000,stage=hours>0&&hours<=2?'soon':hours>2&&hours<=26?'tomorrow':null,key=stage&&`${v.id}-${stage}`;if(key&&v.notice!==key){await notify(`${db.profile.name}: ${v.reason}`,`${stage==='soon'?'Coming up soon':'Upcoming'}: ${dateFmt(v.date)}${v.time?' at '+v.time:''}`,'sakhi-visit');v.notice=key;save()}}}
render();
if('serviceWorker'in navigator)window.addEventListener('load',async()=>{await navigator.serviceWorker.register('./sw.js').catch(()=>null);reminders()});
setInterval(reminders,60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reminders()});
</script></body></html>
